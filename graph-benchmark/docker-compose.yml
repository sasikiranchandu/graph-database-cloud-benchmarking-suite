version: '3.8'

services:
  memgraph:
    image: memgraph/memgraph:latest
    container_name: benchmark_memgraph
    ports:
      - "7687:7687"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    container_name: benchmark_falkordb
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  arangodb:
    image: arangodb:latest
    container_name: benchmark_arangodb
    environment:
      - ARANGO_NO_AUTH=1
    ports:
      - "8529:8529"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
